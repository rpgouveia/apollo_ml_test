[project]
name = "apollo-ml-test"
version = "0.1.0"
description = "Apollo Machine Learning Test"
readme = "README.md"
authors = [
    { name = "Renato Gouveia", email = "rpgouveia@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
