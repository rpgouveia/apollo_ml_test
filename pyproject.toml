[project]
name = "apollo-ml-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Renato Gouveia", email = "rpgouveia@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
apollo-ml-test = "apollo_ml_test:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
